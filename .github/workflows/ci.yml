name: PQFMS CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pqfms_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pqfms_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: pqfms_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret-with-at-least-32-characters-for-pqfms
      INTERNAL_SERVICE_TOKEN: ci-internal-token
      SMS_ENABLED: false
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Initialise fresh schema with checksum-tracked migrations
        run: |
          node backend/scripts/migrate.js
          psql postgresql://postgres:postgres@localhost:5432/pqfms_db -v ON_ERROR_STOP=1 -f db/seed/001_demo_data.sql
      - name: Backend lint and unit tests
        run: npm run verify --prefix backend
      - name: Backend integration smoke tests
        run: npm run test:integration --prefix backend
        env:
          RUN_DB_TESTS: '1'
      - name: Install analytics dependencies
        run: python -m pip install -r analytics_service/requirements.txt -r analytics_service/requirements-dev.txt
      - name: Audit analytics runtime dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r analytics_service/requirements.txt
      - name: Analytics tests
        run: python -m pytest -q analytics_service/tests
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend lint
        run: npm run lint --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet
      - name: Build production API image
        run: docker build --file backend/Dockerfile --tag pqfms-api:ci .
      - name: Build production analytics image
        run: docker build --file analytics_service/Dockerfile --tag pqfms-analytics:ci .
      - name: Build production frontend image
        run: docker build --file frontend/Dockerfile --tag pqfms-web:ci .
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host analytics:127.0.0.1 \
            --entrypoint nginx pqfms-web:ci -t
      - name: Validate Caddy HTTPS configuration
        run: |
          docker run --rm \
            -e PUBLIC_DOMAIN=clinic.example.org \
            -e TLS_CONTACT_EMAIL=operations@example.org \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile
