services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: ${DB_HOST:?Set DB_HOST for the managed PostgreSQL instance}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSL: "true"
      DB_SSLMODE: verify-full
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET from the secrets manager}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set a distinct random internal service token}
      DATA_PROVENANCE_MODE: OPERATIONAL
      ALLOW_NON_OPERATIONAL_PROVENANCE_MODE: "false"
      CORS_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      TRUST_PROXY_HOPS: "2"
      SMS_ENABLED: ${SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ANALYTICS_URL: http://analytics:5001
      STAFFED_STATIONS: ${STAFFED_STATIONS:-1}
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 4s
      start_period: 15s
      retries: 3
    depends_on:
      analytics:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks:
      - appnet

  analytics:
    build:
      context: .
      dockerfile: analytics_service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSLMODE: verify-full
      DATA_PROVENANCE_MODE: OPERATIONAL
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set a distinct random internal service token}
      NODE_SERVER_URL: http://api:5000
      STAFFED_STATIONS: ${STAFFED_STATIONS:-1}
      CORS_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      ANALYTICS_BIND_HOST: 0.0.0.0
      ANALYTICS_PORT: "5001"
    expose:
      - "5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health/ready', timeout=3)"
      interval: 30s
      timeout: 4s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks:
      - appnet

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_ANALYTICS_BASE_URL: /analytics
        VITE_SOCKET_URL: ""
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
      - /tmp:size=8m,noexec,nosuid
    networks:
      - appnet

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to a DNS name pointing at this server}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:?Set a monitored TLS contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - appnet

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["tools"]
    restart: "no"
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_SSL: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      DATA_PROVENANCE_MODE: OPERATIONAL
      CORS_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    command: ["npm", "run", "db:migrate"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
